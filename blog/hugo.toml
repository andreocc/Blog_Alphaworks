baseURL = "https://blog.alphaworks.com.br"
languageCode = "pt-BR"
title = "AlphaWorks Blog"
theme = "PaperMod"
defaultContentLanguage = "pt"
enableInlineShortcodes = true
enableRobotsTXT = true

[params]
  description = "De Tech ao Board — Arquitetura de Decisão, Agentes Autônomos e Governança de Operações"
  author = "André Occenstein"
  keywords = ["IA agêntica", "governança", "automação", "arquitetura de decisão", "agentes autônomos"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

[params.homeInfoParams]
  Title = "AlphaWorks"
  Content = "Arquitetura de Decisão, Agentes Autônomos e Governança de Operações.\n\nDe Tech ao Board."

[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/andreoccentstein"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/alphaworks"

[menu]

[[menu.main]]
  identifier = "posts"
  name = "Artigos"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "Sobre"
  url = "/about/"
  weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
