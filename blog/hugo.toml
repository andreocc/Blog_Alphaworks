baseURL = "https://blog.alphaworks.com.br"
languageCode = "pt-BR"
title = "André Occenstein"
theme = "PaperMod"
defaultContentLanguage = "pt"
enableInlineShortcodes = true
enableRobotsTXT = true
enableGitInfo = true

[params]
  description = "Decisão não é dado. É arquitetura. Blog de André Occenstein — CTO da XALQ. Arquitetura de decisão, agentes autônomos e governança de operações."
  author = "André Occenstein"
  keywords = ["IA agêntica", "governança", "automação", "arquitetura de decisão", "agentes autônomos"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  rssFullContent = true

  [params.favicon]
    icon = "/favicon.ico"
    svg = "/favicon.svg"
    apple = "/apple-touch-icon.png"

[params.homeInfoParams]
  Title = "André Occenstein"
  Content = "Decisão não é dado. É arquitetura."

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/andreocc/"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/andreocc"

[[params.socialIcons]]
  name = "instagram"
  url = "https://www.instagram.com/andreocc.tech/"

[menu]

[[menu.main]]
  identifier = "posts"
  name = "Artigos"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "Sobre"
  url = "/about/"
  weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
